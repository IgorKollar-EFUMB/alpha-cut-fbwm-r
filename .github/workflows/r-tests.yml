name: R checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install HiGHS
        run: Rscript -e 'install.packages("highs", repos="https://cloud.r-project.org")'
      - name: Regression tests
        run: Rscript tests/run_tests.R
      - name: User workflows
        run: |
          Rscript examples/run_acfbwm_example.R
          Rscript examples/run_own_data.R
          Rscript examples/article.R
